apiVersion: v1
kind: ConfigMap
metadata:
  name: gameday-workflow-nrdot-collector-config
  namespace: gameday-workflow
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    processors:
      batch: {}
    exporters:
      otlp/newrelic:
        endpoint: "https://otlp.nr-data.net:4317"
        tls:
          insecure: false
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/newrelic]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/newrelic]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/newrelic]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameday-workflow-nrdot-collector
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-nrdot-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameday-workflow-nrdot-collector
  template:
    metadata:
      labels:
        app: gameday-workflow-nrdot-collector
    spec:
      containers:
        - name: nrdot-collector
          image: newrelic/nrdot-collector:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/nrdot-collector-config/config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-newrelic-secrets
                  key: license-key
          volumeMounts:
            - name: config
              mountPath: /etc/nrdot-collector-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: gameday-workflow-nrdot-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: gameday-workflow-nrdot-collector
  namespace: gameday-workflow
spec:
  selector:
    app: gameday-workflow-nrdot-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
