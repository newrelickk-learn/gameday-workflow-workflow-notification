[package]
name = "workflow-notification-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
sea-orm = { version = "0.12", features = ["runtime-tokio-rustls", "sqlx-postgres", "chrono", "uuid", "macros"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
rust-tracing-otel = { git = "https://github.com/Azumaxoid/rust-tracing-otel" }
futures-util = "0.3"
opentelemetry = "0.31"

[dev-dependencies]
mockall = "0.12"

